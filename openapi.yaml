openapi: 3.0.3
info:
  title: Event API
  version: 0.1.0
  description: API for receiving events and reporting event statistics.
paths:
  /health:
    get:
      summary: Check whether the API is running
      operationId: getHealth
      responses:
        '200':
          description: The API is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                additionalProperties: false
